name: TestFlight

# Builds, signs and uploads the iPhone app to TestFlight. Runs only when started from the Actions tab; run on a tag
# such as ios-v0.2.0 and that becomes the version shown in TestFlight. Signing is done by Xcode with the App Store Connect API
# key, so no certificates or profiles are stored here. See ios/README.md for the one-off setup and secrets.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the signing secrets are set
        id: secrets
        working-directory: .
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::TestFlight secrets aren't set up yet (see ios/README.md); skipping the upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - name: Select Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Prepare signing key and version
        if: steps.secrets.outputs.ready == 'true'
        run: |
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          # A tag like ios-v0.2.0 sets the version; otherwise project.yml's stays.
          if [[ "$GITHUB_REF_NAME" == ios-v* ]]; then
            echo "VERSION_SETTING=MARKETING_VERSION=${GITHUB_REF_NAME#ios-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_SETTING=" >> "$GITHUB_ENV"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          # Archived unsigned: signing here would make Xcode create a new development certificate on every fresh
          # runner, and Apple caps how many an account can have. The upload step signs it for distribution with
          # Apple's cloud-managed certificate instead. Every upload needs a higher build number; the workflow's
          # run number always rises.
          xcodebuild archive \
            -project Nagster.xcodeproj \
            -scheme Nagster \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Nagster.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            $VERSION_SETTING

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nagster.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Uploaded build $GITHUB_RUN_NUMBER. It appears in TestFlight once App Store Connect has processed it (usually 10–30 minutes)."

      - name: Remove signing key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
