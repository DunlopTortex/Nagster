name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Test core logic
        working-directory: ios/NagsterCore
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: |
          # An iPhone on the newest installed iOS runtime (the app needs iOS 26.1 or later).
          udid=$(xcrun simctl list devices available --json |
            jq -r '[.devices | to_entries[] | select(.key | contains("SimRuntime.iOS-"))]
                   | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
                   | last | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            xcrun simctl list devices available
            echo "No iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test app
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nagster.xcodeproj \
            -scheme Nagster \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
